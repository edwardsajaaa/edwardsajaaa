<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="30%" style="stop-color:#1a0000"/>
      <stop offset="50%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e50914"/>
      <stop offset="50%" style="stop-color:#ff1a1a"/>
      <stop offset="100%" style="stop-color:#e50914"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes fall1 { 0% { transform: translateY(-30px); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.7; } 100% { transform: translateY(320px); opacity: 0; } }
    @keyframes fall2 { 0% { transform: translateY(-50px); opacity: 0; } 15% { opacity: 0.8; } 85% { opacity: 0.5; } 100% { transform: translateY(330px); opacity: 0; } }
    @keyframes fall3 { 0% { transform: translateY(-40px); opacity: 0; } 12% { opacity: 0.6; } 88% { opacity: 0.4; } 100% { transform: translateY(340px); opacity: 0; } }
    @keyframes flicker { 0%,100% { opacity: 0.15; } 50% { opacity: 0.4; } }
    @keyframes glitchText { 0%,100% { filter: url(#glow); opacity: 1; } 3% { transform: translate(2px, -1px); opacity: 0.9; } 6% { transform: translate(-2px, 1px); } 9% { transform: translate(0,0); opacity: 1; } 40% { opacity: 1; } 42% { opacity: 0.85; transform: translate(-1px, 0); } 44% { opacity: 1; transform: translate(0,0); } }
    @keyframes pulseGlow { 0%,100% { filter: url(#glow); } 50% { filter: url(#glowStrong); } }
    @keyframes scanline { 0% { transform: translateY(-300px); } 100% { transform: translateY(300px); } }
    @keyframes blink { 0%,49% { opacity: 0.3; } 50%,100% { opacity: 0.15; } }

    .rain { font-family: 'Courier New', monospace; fill: #00ff41; font-size: 14px; }
    .rain-dim { font-family: 'Courier New', monospace; fill: #004d14; font-size: 14px; }
    .rain-bright { font-family: 'Courier New', monospace; fill: #33ff66; font-size: 14px; filter: url(#glow); }
    .rain-red { font-family: 'Courier New', monospace; fill: #e50914; font-size: 14px; }

    .s1 { animation: fall1 4s linear infinite; }
    .s2 { animation: fall2 5.5s linear infinite; }
    .s3 { animation: fall3 7s linear infinite; }
    .s4 { animation: fall1 3.5s linear infinite; }
    .s5 { animation: fall2 6s linear infinite; }
    .s6 { animation: fall3 4.5s linear infinite; }
    .s7 { animation: fall1 5s linear infinite; }
    .s8 { animation: fall2 3.8s linear infinite; }
    .s9 { animation: fall3 6.5s linear infinite; }
    .s10 { animation: fall1 4.2s linear infinite; }
    .s11 { animation: fall2 5.8s linear infinite; }
    .s12 { animation: fall3 3.2s linear infinite; }

    .d0 { animation-delay: 0s; }
    .d1 { animation-delay: 0.3s; }
    .d2 { animation-delay: 0.7s; }
    .d3 { animation-delay: 1.1s; }
    .d4 { animation-delay: 1.5s; }
    .d5 { animation-delay: 2.0s; }
    .d6 { animation-delay: 2.4s; }
    .d7 { animation-delay: 2.9s; }
    .d8 { animation-delay: 3.3s; }
    .d9 { animation-delay: 0.5s; }
    .d10 { animation-delay: 1.8s; }
    .d11 { animation-delay: 3.7s; }
    .d12 { animation-delay: 4.1s; }
    .d13 { animation-delay: 0.9s; }
    .d14 { animation-delay: 1.3s; }
    .d15 { animation-delay: 2.7s; }
    .d16 { animation-delay: 3.1s; }
    .d17 { animation-delay: 4.5s; }

    .title-main {
      font-family: 'Courier New', monospace;
      font-size: 52px;
      font-weight: bold;
      fill: url(#textGrad);
      animation: glitchText 5s ease-in-out infinite;
      letter-spacing: 6px;
    }
    .title-sub {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      fill: #f5c518;
      animation: pulseGlow 3s ease-in-out infinite;
      letter-spacing: 2px;
    }
    .scanline-bar {
      fill: rgba(255,255,255,0.03);
      animation: scanline 8s linear infinite;
    }
    .flicker-text {
      animation: flicker 2s ease-in-out infinite;
    }
    .blink-text {
      animation: blink 1.5s step-start infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Scanline overlay -->
  <rect class="scanline-bar" x="0" y="0" width="1200" height="6" rx="0"/>

  <!-- === BINARY RAIN COLUMNS === -->

  <!-- Column 1 (x=30) -->
  <text class="rain s1 d0" x="30" y="0">1</text>
  <text class="rain-dim s2 d3" x="30" y="60">0</text>
  <text class="rain s3 d6" x="30" y="120">1</text>
  <text class="rain-dim s4 d9" x="30" y="180">0</text>

  <!-- Column 2 (x=60) -->
